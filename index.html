<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service Chatbot</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for scalable vector icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="chat-container">
        <!-- Chat Header -->
        <header class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bot-details">
                    <h1 class="bot-name">Costumer Bot</h1>
                    <span class="status">
                        <span class="status-dot"></span> Online
                    </span>
                </div>
            </div>
            <!-- Optional close button for a complete UI feel -->
            <button class="header-action" aria-label="Close Chat">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>

        <!-- Chat Message History -->
        <section class="chat-history" id="chatHistory">
            <!-- Initial Greeting Message -->
            <div class="message bot-message">
                <div class="message-content">
                    <p>Hello! I'm SupportBot. How can I help you today?</p>
                </div>
            </div>
        </section>

        <!-- Chat Input Area -->
        <footer class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
                <button id="sendBtn" aria-label="Send Message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </main>

    <!-- Custom Logic Script -->
    <script src="script.js"></script>
</body>

</html>
